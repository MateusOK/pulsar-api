name: Ci Build and Tests

on:
    push:
        branches:
            - main
            - develop
            - staging
    pull_request:
        branches:
            - main
            - develop
            - staging

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '21'
              cache: maven

          - name: Build and Test
            run: mvn -B clean verify