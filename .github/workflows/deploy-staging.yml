name: Deploy to Staging

on:
    push:
        branches:
        - staging

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      - name: Build image
        run: |
            docker build -t ghcr.io/${{ github.repository_owner }}/soupulsar:staging .

      - name: Push image
        run: |
            docker push ghcr.io/${{ github.repository_owner }}/soupulsar:staging
          
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: | 
            cd /apps/stg
            docker compose pull
            docker compose up -d
            docker image prune -f