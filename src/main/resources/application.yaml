spring:
  application:
    name: SouPulsar

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

app:
  frontend:
    url: ${FRONTEND_URL}

asaas:
  apiKey: ${ASAAS_API_KEY}
  webhookToken: ${ASAAS_WEBHOOK_TOKEN}

resend:
  apiKey: ${RESEND_API_KEY}
  fromEmail: ${RESEND_FROM_EMAIL}

springdoc:
  packages-to-scan:
    - com.soupulsar.api.controllers
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics