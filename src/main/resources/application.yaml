spring:
  application:
    name: SouPulsar

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

  jpa:
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

app:
  frontend:
    url: ${FRONTEND_URL}

asaas:
  apiKey: ${ASAAS_API_KEY}
  webhookToken: ${ASAAS_WEBHOOK_TOKEN}

resend:
  apiKey: ${RESEND_API_KEY}
  fromEmail: ${RESEND_FROM_EMAIL}

springdoc:
  packages-to-scan:
    - com.soupulsar.api.controllers
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger
    enabled: true
    operationsSorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  model-converters:
    pageable-converter:
      enabled: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    shutdown:
      access: none